spring:
  application:
    name: "transactions"
  datasource:
    url: jdbc:postgresql://localhost:5433/transakt
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  config:
    import: "configserver:http://localhost:8070/"
  cloud:
    function:
      definition: accountOpened;transferSuccess;transferRejected
    stream:
      kafka:
        binder:
          autoCreateTopics: true
          brokers: localhost:9092
      bindings:
        accountOpened-in-0:
          destination: transakt.account-opened
          group: ${spring.application.name}
        cashDeposited-out-0:
          destination: transakt.cash-deposited
        cashWithdrawn-out-0:
          destination: transakt.cash-withdrawn
        transferSubmitted-out-0:
          destination: transakt.transfer-submitted
        transferSuccess-in-0:
          destination: transakt.transfer-success
          group: ${spring.application.name}
        transferRejected-in-0:
          destination: transakt.transfer-rejected
          group: ${spring.application.name}

logging:
  level:
    com:
      cdcrane:
        transakt:
          transactions: info
    org.springframework.cloud.function.context.catalog.BeanFactoryAwareFunctionRegistry: ERROR


server:
  port: 8100

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8075/eureka/